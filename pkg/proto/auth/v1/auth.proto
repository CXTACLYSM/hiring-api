syntax = "proto3";

package auth.v1;

option go_package = "github.com/CXTACLYSM/hiring-api/pkg/grpc/auth/v1";

service AuthService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  User user = 2;
  string error = 3;
}

message User {
  string id = 1;
  string username = 2;
  string email = 3;
}