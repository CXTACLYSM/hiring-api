# =============================================================================
# HIRING SERVICE - DOCKER COMPOSE
# =============================================================================
# Variables loaded from .envs/ directory:
#   infra/.env.infra                          - infrastructure config
#   app/services/auth/.env                    - auth service env
#   app/services/blog/.env                    - blog service env
#   app/services/notifications/.env           - notifications service env
#   infra/services/postgres-primary/.env      - postgres primary env
#   infra/services/postgres-replica/.env      - postgres replica env
#   infra/services/redis/.env                 - redis env
# Run: make up
# =============================================================================

services:
  # ===========================================================================
  # AUTH
  # ===========================================================================
  # Auth microservice: JWT authentication, user management
  # Exposes REST API (8080) and gRPC (50051) for inter-service communication
  # Other services call gRPC ValidateToken to authenticate requests
  auth:
    # Image
    image: ${COMPANY_DOCKER_REGISTRY_HOST}/${COMPANY_HIRING_PROJECT_NAME}/auth:${COMPANY_HIRING_VERSION}
    # Network
    container_name: ${COMPANY_HIRING_AUTH_HOST}
    hostname: ${COMPANY_HIRING_AUTH_HOST}
    ports:
      - "8080:${COMPANY_HIRING_AUTH_HTTP_PORT}"
      - "50051:${COMPANY_HIRING_AUTH_GRPC_PORT}"
    networks:
      - backend
    # Runtime
    user: "1000:1000"
    env_file:
      - .envs/app/services/auth/.env
    # Deploy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: ["./auth"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://${COMPANY_HIRING_AUTH_HOST}:${COMPANY_HIRING_AUTH_HTTP_PORT}/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres_primary:
        condition: service_healthy
      postgres_replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # BLOG
  # ===========================================================================
  # Blog microservice: CRUD for posts
  # Authenticates via gRPC call to auth service
  # Publishes events to Kafka (e.g. post.created, post.updated)
  blog:
    # Image
    image: ${COMPANY_DOCKER_REGISTRY_HOST}/${COMPANY_HIRING_PROJECT_NAME}/blog:${COMPANY_HIRING_VERSION}
    # Network
    container_name: ${COMPANY_HIRING_BLOG_HOST}
    hostname: ${COMPANY_HIRING_BLOG_HOST}
    ports:
      - "8081:${COMPANY_HIRING_BLOG_HTTP_PORT}"
    networks:
      - backend
    # Runtime
    user: "1000:1000"
    env_file:
      - .envs/app/services/blog/.env
    # Deploy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: ["./blog"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://${COMPANY_HIRING_BLOG_HOST}:${COMPANY_HIRING_BLOG_HTTP_PORT}/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      auth:
        condition: service_healthy
      postgres_primary:
        condition: service_healthy
      postgres_replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # NOTIFICATIONS
  # ===========================================================================
  # Notifications microservice: consumes Kafka events, sends notifications
  # Listens to topics like post.created, post.updated
  # Does not expose HTTP API (worker-style service)
  notifications:
    # Image
    image: ${COMPANY_DOCKER_REGISTRY_HOST}/${COMPANY_HIRING_PROJECT_NAME}/notifications:${COMPANY_HIRING_VERSION}
    # Network
    container_name: ${COMPANY_HIRING_NOTIFICATIONS_HOST}
    hostname: ${COMPANY_HIRING_NOTIFICATIONS_HOST}
#    ports:
#      -
    networks:
      - backend
    # Runtime
    user: "1000:1000"
    env_file:
      - .envs/app/services/notifications/.env
    # Deploy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: ["./notifications"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # POSTGRESQL PRIMARY (WRITE)
  # ===========================================================================
  # Primary PostgreSQL instance for write operations
  # Physical streaming replication to replica via WAL
  # Init script creates databases, users, replication slots, grants
  postgres_primary:
    # Image
    image: postgres:16-alpine
    # Network
    container_name: ${COMPANY_HIRING_POSTGRES_PRIMARY_HOST}
    hostname: ${COMPANY_HIRING_POSTGRES_PRIMARY_HOST}
    ports:
      - "5432:${COMPANY_HIRING_POSTGRES_PRIMARY_PORT}"
    networks:
      backend:
        aliases:
          - ${COMPANY_HIRING_POSTGRES_PRIMARY_HOST}
    # Runtime
    user: postgres
    env_file:
      - .envs/infra/services/postgres-primary/.env
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./builds/local/postgres/primary/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./builds/local/postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./scripts/init/postgres-primary-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Deploy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ===========================================================================
  # POSTGRESQL REPLICA (READ)
  # ===========================================================================
  # Read-only replica for SELECT queries (CQRS read side)
  # Streams WAL from primary, always in recovery mode
  postgres_replica:
    # Image
    image: postgres:16-alpine
    # Network
    container_name: ${COMPANY_HIRING_POSTGRES_REPLICA_HOST}
    hostname: ${COMPANY_HIRING_POSTGRES_REPLICA_HOST}
    ports:
      - "5433:${COMPANY_HIRING_POSTGRES_REPLICA_PORT}"
    networks:
      backend:
        aliases:
          - ${COMPANY_HIRING_POSTGRES_REPLICA_HOST}
    # Runtime
    user: root
    env_file:
      - .envs/infra/services/postgres-replica/.env
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./builds/local/postgres/replica/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./builds/local/postgres/replica/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./scripts/init/postgres-replica-init.sh:/usr/local/bin/replica-init.sh:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Deploy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    command: ["/bin/bash", "/usr/local/bin/replica-init.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$PGUSER && psql -U $$PGUSER -d $$PGDATABASE -c 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres_primary:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # REDIS
  # ===========================================================================
  # In-memory cache and session store
  # Used for: token blacklist, rate limiting, caching
  redis:
    image: redis:7.4-alpine
    container_name: ${COMPANY_HIRING_REDIS_HOST}
    hostname: ${COMPANY_HIRING_REDIS_HOST}
    ports:
      - "6379:${COMPANY_HIRING_REDIS_PORT}"
    networks:
      backend:
        aliases:
          - ${COMPANY_HIRING_REDIS_HOST}
    user: redis
    env_file:
      - .envs/infra/services/redis/.env
    volumes:
      - redis_data:/data
      - ./builds/local/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./scripts/init/redis-init.sh:/usr/local/bin/redis-init.sh:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    command: ["/bin/sh", "/usr/local/bin/redis-init.sh"]
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "${COMPANY_HIRING_REDIS_USERNAME}", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ===========================================================================
  # KAFKA (KRaft mode, no Zookeeper)
  # ===========================================================================
  # Message broker for async event-driven communication between services
  # Blog publishes events (post.created, post.updated, post.deleted)
  # Notifications consumes events and sends notifications
  # KRaft mode — built-in consensus, no Zookeeper dependency
  kafka:
    image: apache/kafka:3.9.0
    container_name: ${COMPANY_HIRING_KAFKA_HOST}
    hostname: ${COMPANY_HIRING_KAFKA_HOST}
    ports:
      - "${COMPANY_HIRING_KAFKA_PORT}:9092"
    networks:
      backend:
        aliases:
          - ${COMPANY_HIRING_KAFKA_HOST}
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@${COMPANY_HIRING_KAFKA_HOST}:9093
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${COMPANY_HIRING_KAFKA_HOST}:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Log retention
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      # KRaft
      CLUSTER_ID: "hiring-kafka-cluster-id-01"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    networks:
      - backend
    environment:
      KAFKA_HOST: ${COMPANY_HIRING_KAFKA_HOST}
      KAFKA_PORT: ${COMPANY_HIRING_KAFKA_PORT}
    volumes:
      - ./scripts/init/kafka-init.sh:/opt/kafka/scripts/kafka-init.sh:ro
    command: [ "/bin/bash", "/opt/kafka/scripts/kafka-init.sh" ]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # ===========================================================================
  # KAFKA UI (development only)
  # ===========================================================================
  # Web UI for browsing Kafka topics, messages, consumer groups
  # Access at http://localhost:8090
  # Remove in production
  kafka_ui:
    # Image
    image: provectuslabs/kafka-ui:latest
    # Network
    container_name: ${COMPANY_HIRING_KAFKA_HOST}-ui
    ports:
      - "8090:8080"
    networks:
      - backend
    # Runtime
    environment:
      - KAFKA_CLUSTERS_0_NAME=hiring-local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=${COMPANY_HIRING_KAFKA_HOST}:9092
      - DYNAMIC_CONFIG_ENABLED=true
    # Deploy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_primary_data:
  postgres_replica_data:
  redis_data:
  kafka_data:

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  backend:
    name: ${PG_NETWORK}
    driver: bridge